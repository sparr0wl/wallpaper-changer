name: Build and release

on:
  push:
    branches: [main]
    tags: ['7.41f+Trove_of_Terror']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: 7.41f+Trove_of_Terror

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make g++ rpm python3 ffmpeg liblz4-1 qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-qpa-plugins qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtmultimedia libgl1-mesa-dri
      - uses: actions/checkout@v4
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Build native Qt application
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 4
          build/native/wallpaper-changer --version
          build/native/wallpaper-changer --self-test
      - name: Native UI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python3 tests/smoke_ui.py --fixture
      - name: Package DEB, RPM and archive
        run: |
          mkdir -p dist
          cd build/native
          cpack -G DEB -B ../../dist
          cpack -G RPM -B ../../dist
          cd ../..
          cmake --install build/native --prefix /tmp/wallpaper-portable
          cp packaging/install-linux-archive.sh /tmp/wallpaper-portable/install.sh
          chmod +x /tmp/wallpaper-portable/install.sh
          tar -C /tmp/wallpaper-portable -czf "dist/wallpaper-changer-${RELEASE_TAG}-linux-x86_64.tar.gz" .
      - name: Test installed DEB
        run: |
          apt-get install -y ./dist/*.deb
          /usr/bin/wallpaper-changer --version
          /usr/bin/wallpaper-changer --self-test
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software /usr/bin/wallpaper-changer --smoke-test /tmp/installed-ui
          rpm -qpl dist/*.rpm
          rpm -qp --requires dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg --version=7.1.1 --allow-downgrade -y --no-progress
      - name: Unit and integration tests
        shell: pwsh
        run: |
          python -m pip install lz4==4.4.4
          $FFmpeg = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $env:PATH = "$($FFmpeg.DirectoryName);$env:PATH"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and test Windows installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  fedora-install:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and exercise RPM on Fedora
        run: |
          dnf install -y dist/*.rpm
          wallpaper-changer --version
          wallpaper-changer --self-test
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software wallpaper-changer --smoke-test /tmp/rpm-ui

  publish:
    needs: [linux, windows, fedora-install]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release-assets
          merge-multiple: true
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Wallpaper changer — $RELEASE_TAG" --notes-file RELEASE_NOTES.md release-assets/*
